<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Gift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen active">
        <h2 class="title" style="margin-bottom: 20px;">Create Your Custom Gift 🎁</h2>
        <form id="generator-form" style="display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 500px; text-align: left; margin: 0 auto;">
            
            <label style="font-weight: bold; color: #db2777;">Love Letter Text:</label>
            <textarea id="letter-input" rows="4" style="padding: 10px; border-radius: 8px; border: 1px solid #fbcfe8;" required></textarea>

            <label style="font-weight: bold; color: #db2777;">Song Title:</label>
            <input type="text" id="song-title" style="padding: 10px; border-radius: 8px; border: 1px solid #fbcfe8;" required>

            <label style="font-weight: bold; color: #db2777;">Artist Name:</label>
            <input type="text" id="artist-name" style="padding: 10px; border-radius: 8px; border: 1px solid #fbcfe8;" required>

            <label style="font-weight: bold; color: #db2777;">Upload 5 Photos:</label>
            <input type="file" id="photos-upload" accept="image/*" multiple required>

            <label style="font-weight: bold; color: #db2777;">Upload Song (MP3):</label>
            <input type="file" id="song-upload" accept="audio/mp3" required>

            <button type="submit" class="btn yes" style="margin-top: 10px;">Generate My Link</button>
        </form>
        <div id="output-link" style="margin-top: 20px; font-weight: bold; color: #db2777;"></div>
    </div>
    
    <script type="module" src="generator.js"></script>
</body>
</html>
