<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Gift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen active" style="overflow: auto; max-height: 100vh; padding: 20px 0;">
        <h2 class="title" style="margin-bottom: 20px;">Create Your Custom Gift 🎁</h2>
        <form id="generator-form" style="display: flex; flex-direction: column; gap: 12px; width: 85%; max-width: 500px; text-align: left; margin: 0 auto;">
            
            <label style="font-weight: bold; color: #db2777;">Love Letter Text:</label>
            <textarea id="letter-input" rows="3" style="padding: 10px; border-radius: 8px; border: 1px solid #fbcfe8;" required></textarea>

            <label style="font-weight: bold; color: #db2777;">Song Title & Artist:</label>
            <input type="text" id="song-title" placeholder="e.g. Risk It All" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            <input type="text" id="artist-name" placeholder="e.g. Bruno Mars" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            
            <label style="font-weight: bold; color: #db2777;">Song URL (Dropbox MP3 link ending in ?raw=1):</label>
            <input type="url" id="song-url" placeholder="Paste MP3 link here" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>

            <label style="font-weight: bold; color: #db2777;">1 Song Cover Photo URL:</label>
            <input type="url" id="cover-photo" placeholder="Cover Image Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>

            <label style="font-weight: bold; color: #db2777;">5 Scattered Photo URLs:</label>
            <input type="url" id="photo-1" placeholder="Photo 1 Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            <input type="url" id="photo-2" placeholder="Photo 2 Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            <input type="url" id="photo-3" placeholder="Photo 3 Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            <input type="url" id="photo-4" placeholder="Photo 4 Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>
            <input type="url" id="photo-5" placeholder="Photo 5 Link (.jpg/.png)" style="padding: 8px; border-radius: 8px; border: 1px solid #fbcfe8;" required>

            <button type="submit" class="btn yes" style="margin-top: 10px;">Generate My Link</button>
        </form>
        <div id="output-link" style="margin-top: 20px; font-weight: bold; color: #db2777; text-align: center; margin-bottom: 40px;"></div>
    </div>
    
    <script type="module" src="generator.js"></script>
</body>
</html>
