<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🩷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Question Screen -->
    <div id="question-container" class="screen active">
        <img src="ask.gif" alt="Cute cat" class="gif">
        <h2 id="question-text">Do you love me? 🩷</h2>
        <div class="btn-group">
            <button id="yes-btn" class="btn yes">YES</button>
            <button id="no-btn" class="btn no">NO</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div id="success-container" class="screen">
        <h2 class="title">I knew you'd say yes 💕</h2>
        <img src="yes.gif" alt="Kiss cat" class="gif">
        <div class="gift-row">
            <div class="gift-box" onclick="showScreen('gift-1')">
                <img src="gift-icon.png" class="gift-img" alt="Gift 1"><br>GIFT 1
            </div>
            <div class="gift-box" onclick="showScreen('gift-2')">
                <img src="gift-icon.png" class="gift-img" alt="Gift 2"><br>GIFT 2
            </div>
            <div class="gift-box" onclick="showScreen('gift-3')">
                <img src="gift-icon.png" class="gift-img" alt="Gift 3"><br>GIFT 3
            </div>
        </div>
    </div>

    <!-- Gift 1: Photos -->
    <div id="gift-1" class="screen">
        <h2 class="title" style="margin-bottom: 30px;">Captured memories</h2>
        <div class="scatter-gallery">
            <div class="scatter-frame frame-1"><img src="" alt="Memory"></div>
            <div class="scatter-frame frame-2"><img src="" alt="Memory"></div>
            <div class="scatter-frame frame-3"><img src="" alt="Memory"></div>
            <div class="scatter-frame frame-4"><img src="" alt="Memory"></div>
            <div class="scatter-frame frame-5"><img src="" alt="Memory"></div>
        </div>
        <button class="btn back" onclick="showScreen('success-container')" style="margin-top: 40px;">BACK</button>
    </div>

   <!-- Gift 2: EXACT Music Player Replica -->
    <div id="gift-2" class="screen">
        <h2 class="title" style="margin-bottom: 20px; font-style: italic;">A song that reminds me of us</h2>
        
        <div class="music-card-exact">
            <div class="vinyl-side">
                <div class="vinyl" id="vinyl-record">
                    <div class="vinyl-label">
                        <span class="vinyl-text">Love</span>
                        <div class="vinyl-hole"></div>
                    </div>
                </div>
            </div>
            <div class="player-side">
                <img src="" class="song-bg" alt="Cover">
                <div class="player-overlay">
                    <div class="song-text">
                        <h3>Song Title</h3>
                        <p>Artist</p>
                    </div>
                    <audio id="audio-player" src="" controls controlsList="nodownload"></audio>
                </div>
            </div>
        </div>

        <button class="btn back" onclick="showScreen('success-container')">BACK</button>
    </div>

    <!-- Gift 3: Letter with Kisses Background -->
    <div id="gift-3" class="screen">
        <div class="letter-card">
            <h2>Dear Love,</h2>
            <p>Your letter will appear here.</p>
            <p class="letter-signature">Forever yours 💕</p>
        </div>
        <button class="btn back" onclick="showScreen('success-container')">BACK</button>
    </div>

    <script src="script.js"></script>
    <script type="module" src="viewer.js"></script>
</body>
</html>
