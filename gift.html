<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Gift 🩷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen active" style="padding: 20px; overflow-y: auto;">
        <h2 class="title" style="margin-bottom: 20px;">Create Your Custom Gift 🎁</h2>
        <form id="generator-form" style="display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; text-align: left;">
            
            <label style="font-weight: bold; color: #db2777;">Love Letter Text:</label>
            <textarea id="letter-input" rows="4" style="padding: 10px; border-radius: 8px; border: 1px solid #fbcfe8;" required></textarea>

            <label style="font-weight: bold; color: #db2777;">Song Title & Artist:</label>
            <input type="text" id="song-title" placeholder="e.g. Risk It All" style="padding: 10px; border-radius: 8px;" required>
            <input type="text" id="artist-name" placeholder="e.g. Bruno Mars" style="padding: 10px; border-radius: 8px;" required>

            <label style="font-weight: bold; color: #db2777;">Direct Audio URL (MP3):</label>
            <input type="url" id="song-url" placeholder="https://..." style="padding: 10px; border-radius: 8px;" required>

            <label style="font-weight: bold; color: #db2777;">Direct Photo URLs (JPG/PNG):</label>
            <input type="url" id="photo-1" placeholder="Photo 1 URL" style="padding: 10px; border-radius: 8px;" required>
            <input type="url" id="photo-2" placeholder="Photo 2 URL" style="padding: 10px; border-radius: 8px;" required>
            <input type="url" id="photo-3" placeholder="Photo 3 URL" style="padding: 10px; border-radius: 8px;" required>
            <input type="url" id="photo-4" placeholder="Photo 4 URL" style="padding: 10px; border-radius: 8px;" required>

            <button type="submit" class="btn yes" style="margin-top: 10px;">Generate My Link</button>
        </form>
        
        <div id="output-section" style="margin-top: 20px; text-align: center; display: none;">
            <p style="font-weight: bold; color: #db2777;">Copy and send this link:</p>
            <input type="text" id="generated-link" style="padding: 10px; width: 100%; border-radius: 8px;" readonly>
        </div>
    </div>
    <script type="module" src="generator.js"></script>
</body>
</html>
